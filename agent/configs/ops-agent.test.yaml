# ClickHouse Operations Agent Test Configuration
#
# Same environment variables as ops-agent.yaml (see header there). docker-compose.test.yml sets them for CI/local Docker tests.

# Application Information
app:
  name: "ClickHouse Operations Agent"
  version: "1.0.0"

# HTTP Server Configuration
server:
  port: 8080
  jwt_secret_key: "${OPS_JWT_SECRET_KEY}"
  jwt_token_duration: "24h"
  rate_limit_rps: 0        # Disable rate limiting for tests
  rate_limit_burst: 0

# Database Configuration
database:
  postgres:
    dsn: "${OPS_POSTGRES_DSN}"
  clickhouse:
    # Cluster name for operations
    cluster_name: "${OPS_CLUSTER_NAME}"
    
    # Cluster configuration with individual node settings
    nodes:
      - name: "${OPS_CLICKHOUSE_NAME}"
        host: "${OPS_CLICKHOUSE_HOST}"
        port: ${OPS_CLICKHOUSE_PORT}
        username: "${OPS_CLICKHOUSE_USERNAME}"
        password: "${OPS_CLICKHOUSE_PASSWORD}"
        database: "${OPS_CLICKHOUSE_DATABASE}"
        weight: 1
        priority: 1
        metrics_schema: "${OPS_CLICKHOUSE_METRICS_SCHEMA}"
        metrics_table: "${OPS_CLICKHOUSE_METRICS_TABLE}"
        backups_table: "ops.backups"
    
    # Global settings (applied to all nodes unless overridden)
    global_settings:
      # Version constraints
      min_version: "24.0.0"
      max_version: "25.10.6"
      
      # Connection timeouts
      dial_timeout: "5s"
      read_timeout: "10s"
      write_timeout: "10s"
      
      # Connection pooling
      conn_max_lifetime: "1h"
      max_open_conns: 10
      max_idle_conns: 5
      
      # Retry configuration
      retry_max_attempts: 3
      retry_initial_backoff: "100ms"
      retry_max_backoff: "2s"
      retry_jitter: 0.2
      retry_on_insert: false
      
      # Security and compression (defaults for all nodes)
      secure: false
      skip_verify: false
      compression: "lz4"
      
      # Query configuration
      query_id_prefix: "ops-agent-test"

# Logging Configuration
logging:
  level: "info"
  format: "text"

# Sync Configuration
sync:
  metrics_frequency: "1s"
  metrics_snapshot_enabled: true
  retention_days: 10
  processes_poll_interval: "2s"

