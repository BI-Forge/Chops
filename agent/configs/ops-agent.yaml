# ClickHouse Operations Agent Configuration
#
# Secrets and connection targets are taken from the environment (see docker-compose or your orchestrator).
# Required variables (first ClickHouse node only in this file):
#   OPS_JWT_SECRET_KEY
#   OPS_POSTGRES_DSN
#   OPS_CLICKHOUSE_NAME, OPS_CLICKHOUSE_HOST, OPS_CLICKHOUSE_PORT
#   OPS_CLICKHOUSE_USERNAME, OPS_CLICKHOUSE_PASSWORD, OPS_CLICKHOUSE_DATABASE
#   OPS_CLICKHOUSE_METRICS_SCHEMA, OPS_CLICKHOUSE_METRICS_TABLE
# Syntax follows os.ExpandEnv: ${VAR_NAME}

# Application Information
app:
  name: "ClickHouse Operations Agent"
  version: "1.0.0"

# HTTP Server Configuration
server:
  port: 8080
  jwt_secret_key: "${OPS_JWT_SECRET_KEY}"
  jwt_token_duration: "24h"  # Token expiration time (e.g., "24h", "1h", "30m")
  rate_limit_rps: 100        # Requests per second (0 to disable)
  rate_limit_burst: 200      # Burst size for rate limiting

# Database Configuration
database:
  postgres:
    dsn: "${OPS_POSTGRES_DSN}"
  clickhouse:
    # Cluster name for operations
    cluster_name: "${OPS_CLUSTER_NAME}"
    
    # Cluster configuration with individual node settings
    nodes:
      - name: "${OPS_CLICKHOUSE_NAME}"
        host: "${OPS_CLICKHOUSE_HOST}"
        port: ${OPS_CLICKHOUSE_PORT}
        username: "${OPS_CLICKHOUSE_USERNAME}"
        password: "${OPS_CLICKHOUSE_PASSWORD}"
        database: "${OPS_CLICKHOUSE_DATABASE}"
        weight: 3
        priority: 1
        metrics_schema: "${OPS_CLICKHOUSE_METRICS_SCHEMA}"
        metrics_table: "${OPS_CLICKHOUSE_METRICS_TABLE}"
        backups_table: "system.backups"
      - name: "${OPS_CLICKHOUSE_NAME_2}"
        host: "${OPS_CLICKHOUSE_HOST_2}"
        port: ${OPS_CLICKHOUSE_PORT_2}
        username: "${OPS_CLICKHOUSE_USERNAME_2}"
        password: "${OPS_CLICKHOUSE_PASSWORD_2}"
        database: "${OPS_CLICKHOUSE_DATABASE_2}"
        weight: 3
        priority: 2
        metrics_schema: "${OPS_CLICKHOUSE_METRICS_SCHEMA_2}"
        metrics_table: "${OPS_CLICKHOUSE_METRICS_TABLE_2}"
        backups_table: "system.backups"
      # Example of additional nodes with different credentials:
      # - name: "replica-1"
      #   host: "ch-replica-1.example.com"
      #   port: 9000
      #   username: "readonly_user"
      #   password: "readonly_pass"
      #   database: "analytics"
      #   secure: true  # Override global secure setting
      #   weight: 2
      #   priority: 2
      # - name: "replica-2"
      #   host: "ch-replica-2.example.com"
      #   port: 9000
      #   username: "admin_user"
      #   password: "admin_pass"
      #   database: "default"
      #   compression: "gzip"  # Override global compression
      #   weight: 1
      #   priority: 1
    
    # Global settings (applied to all nodes unless overridden)
    global_settings:
      # Version constraints
      min_version: "24.0.0"
      max_version: "25.10.6"
      
      # Connection timeouts
      dial_timeout: "3s"
      read_timeout: "10s"
      write_timeout: "10s"
      
      # Connection pooling
      conn_max_lifetime: "30m"
      max_open_conns: 16
      max_idle_conns: 8
      
      # Retry configuration
      retry_max_attempts: 4
      retry_initial_backoff: "100ms"
      retry_max_backoff: "2s"
      retry_jitter: 0.2
      retry_on_insert: false
      
      # Security and compression (defaults for all nodes)
      secure: false
      skip_verify: false
      compression: "lz4"
      
      # Query configuration
      query_id_prefix: "ops-agent"

# Logging Configuration
logging:
  level: "info"
  format: "text"

# Sync Configuration
sync:
  metrics_frequency: "1s"        # Frequency of metrics synchronization (e.g., "1s", "1m", "5s")
  retention_days: 7               # Number of days to keep metrics data in PostgreSQL
  processes_poll_interval: "2s"  # Interval for polling system.processes (e.g., "2s", "5s")
