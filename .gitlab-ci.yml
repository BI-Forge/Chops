variables:
  # Upstream Chops version = image tag on Docker Hub (alexindacomp/chops-app, chops-front).
  # To update the app: bump this tag, then run deploy-prod.
  CHOPS_VERSION: "v1.0.0"
  NAMESPACE: bi-clickhouse
  APP_NAME: chops
  K8S_PROD_SERVER: https://api.live.eq.k8s.rozetka.company/

default:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.rozetka.company

stages:
  - deploy
  - rollback

deploy-prod:
  stage: deploy
  image: registry.gitlab.rozetka.company/devops/devops-docker-images/kubectl-helm-vault
  script:
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt_v2/login role=${CI_PROJECT_NAME} jwt=${VAULT_ID_TOKEN})"
    - export RZ_CI_K8S_TOKEN="$(vault kv get -field=K8S_TOKEN RBI/PROD/CHOPS)"
    - export OPS_JWT_SECRET_KEY="$(vault kv get -field=OPS_JWT_SECRET_KEY RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_HOST="$(vault kv get -field=OPS_CLICKHOUSE_HOST RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_USERNAME="$(vault kv get -field=OPS_CLICKHOUSE_USERNAME RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_PASSWORD="$(vault kv get -field=OPS_CLICKHOUSE_PASSWORD RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_HOST_2="$(vault kv get -field=OPS_CLICKHOUSE_HOST_2 RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_USERNAME_2="$(vault kv get -field=OPS_CLICKHOUSE_USERNAME_2 RBI/PROD/CHOPS)"
    - export OPS_CLICKHOUSE_PASSWORD_2="$(vault kv get -field=OPS_CLICKHOUSE_PASSWORD_2 RBI/PROD/CHOPS)"
    - kubectl config set-cluster k8s-server --server="$K8S_PROD_SERVER" --insecure-skip-tls-verify=true
    - kubectl config set-credentials k8s-user --token="$RZ_CI_K8S_TOKEN"
    - kubectl config set-context k8s-context --cluster=k8s-server --user=k8s-user
    - kubectl config use-context k8s-context
    - |
      helm upgrade -i -n $NAMESPACE $APP_NAME \
        --atomic --timeout=5m \
        helm/chops \
        -f helm/chops/values-prod.yaml \
        --set image.tag=$CHOPS_VERSION \
        --set secretEnv.OPS_JWT_SECRET_KEY="$OPS_JWT_SECRET_KEY" \
        --set secretEnv.OPS_CLICKHOUSE_HOST="$OPS_CLICKHOUSE_HOST" \
        --set secretEnv.OPS_CLICKHOUSE_USERNAME="$OPS_CLICKHOUSE_USERNAME" \
        --set secretEnv.OPS_CLICKHOUSE_PASSWORD="$OPS_CLICKHOUSE_PASSWORD" \
        --set secretEnv.OPS_CLICKHOUSE_HOST_2="$OPS_CLICKHOUSE_HOST_2" \
        --set secretEnv.OPS_CLICKHOUSE_USERNAME_2="$OPS_CLICKHOUSE_USERNAME_2" \
        --set secretEnv.OPS_CLICKHOUSE_PASSWORD_2="$OPS_CLICKHOUSE_PASSWORD_2"
  when: manual
  tags:
    - rozetka-shared-standart
  only: [master, web]

rollback-prod:
  stage: rollback
  image: registry.gitlab.rozetka.company/devops/devops-docker-images/kubectl-helm-vault
  script:
    - export VAULT_TOKEN="$(vault write -field=token auth/jwt_v2/login role=${CI_PROJECT_NAME} jwt=${VAULT_ID_TOKEN})"
    - export RZ_CI_K8S_TOKEN="$(vault kv get -field=K8S_TOKEN RBI/PROD/CHOPS)"
    - kubectl config set-cluster k8s-server --server="$K8S_PROD_SERVER" --insecure-skip-tls-verify=true
    - kubectl config set-credentials k8s-user --token="$RZ_CI_K8S_TOKEN"
    - kubectl config set-context k8s-context --cluster=k8s-server --user=k8s-user
    - kubectl config use-context k8s-context
    - helm -n $NAMESPACE rollback $APP_NAME 0
  when: manual
  tags:
    - rozetka-shared-standart
  only: [master, web]
