name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v*'

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chops-app:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chops-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/build/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chops-front:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chops-front:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
